# =====================================================================================
# trainer_config.yaml — ML-Agents Release 23 (Python mlagents 1.1.x) / PPO
#
# 実行例（プロジェクトルートで）:
#   mlagents-learn config/trainer_config.yaml --run-id=traffic_ppo_01
#   → "Listening on port 5004" が出たら Unity エディタで Play
#   ビルド済み環境を使う場合:
#   mlagents-learn config/trainer_config.yaml --run-id=traffic_ppo_01 \
#       --env=Builds/AdaptiveTraffic --num-envs=4 --no-graphics
#   TensorBoard:
#   tensorboard --logdir results
#
# 前提（Unity 側）:
#   - Behavior Parameters の Behavior Name = TrafficLight
#   - Fixed Timestep 0.05 / Decision Period 20 → 1 判断 = シミュレーション 1 秒
#     以下の step 数はすべて「判断ステップ」単位（全エージェント合計）。
# =====================================================================================
behaviors:
  TrafficLight:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 4096           # batch_size の倍数。エリアを増やしたら比例して増やす
      learning_rate: 3.0e-4
      beta: 5.0e-3                # エントロピー正則化（2 択なので小さめ）
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false            # 観察は Unity 側で 0..1 に正規化済み
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99               # 1 判断 = 1 秒 → 実効ホライズン約 100 秒
        strength: 1.0
    max_steps: 2000000
    time_horizon: 256             # 約 4 分ぶんで価値関数ブートストラップ
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 200000
    threaded: false

# TrafficLightAgent.OnEpisodeBegin で読み取る環境パラメータ。
# demand_scale: 交通需要倍率（2.0 = 発生間隔 1/2 = 交通量 2 倍）
environment_parameters:
  demand_scale: 1.0
  # カリキュラム学習にする場合は上の行を以下に置き換える（threshold は学習曲線を見て調整）
  # demand_scale:
  #   curriculum:
  #     - name: Light
  #       completion_criteria:
  #         measure: reward
  #         behavior: TrafficLight
  #         signal_smoothing: true
  #         min_lesson_length: 100
  #         threshold: 20.0
  #       value: 0.6
  #     - name: Normal
  #       completion_criteria:
  #         measure: reward
  #         behavior: TrafficLight
  #         signal_smoothing: true
  #         min_lesson_length: 100
  #         threshold: 20.0
  #       value: 1.0
  #     - name: Heavy
  #       value: 1.5

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  width: 84
  height: 84
  quality_level: 5

