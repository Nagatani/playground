name: Deploy Playground Portal & MoonBit to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'MoonBit/**'
      - 'portal/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages directory structure
        run: |
          mkdir -p _site/moonbit
          
          # 1. Copy portal landing page to site root
          cp portal/index.html _site/index.html
          
          # 2. Copy MoonBit web application to /moonbit/ subpath
          cp -r MoonBit/web/* _site/moonbit/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
